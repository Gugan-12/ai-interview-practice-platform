<!DOCTYPE html>
<html>
<head>

<title>Interview History</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>

<style>

/* GLOBAL */

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Inter",sans-serif;
}

body{
display:flex;
background:linear-gradient(-45deg,#eef2ff,#f8fafc,#e0f2fe,#eef2ff);
background-size:400% 400%;
animation:bgMove 12s ease infinite;
}

@keyframes bgMove{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}

/* SIDEBAR */

.sidebar{
width:240px;
height:100vh;
background:#0b132b;
color:white;
padding:25px;
position:fixed;
left:0;
top:0;
}

.sidebar h2{
margin-bottom:35px;
text-align:center;
}

.sidebar a{
display:flex;
align-items:center;
gap:10px;
color:#cbd5e1;
padding:12px;
text-decoration:none;
border-radius:8px;
margin-bottom:6px;
transition:.25s;
}

.sidebar a:hover{
background:#4f46e5;
color:white;
}

/* MAIN */

.main{
margin-left:240px;
padding:40px;
width:100%;
}

.title{
font-size:26px;
font-weight:700;
margin-bottom:25px;
}

/* CARD */

.card{
background:white;
border-radius:14px;
padding:25px;
margin-bottom:30px;
box-shadow:0 10px 25px rgba(0,0,0,0.08);
animation:fadeUp .4s ease;
}

@keyframes fadeUp{
from{opacity:0;transform:translateY(10px)}
to{opacity:1}
}

.card h3{
margin-bottom:15px;
color:#1e293b;
}

/* TABLE */

table{
width:100%;
border-collapse:collapse;
margin-top:10px;
}

th{
background:#f8fafc;
color:#64748b;
font-size:14px;
}

th,td{
padding:12px;
border-bottom:1px solid #e5e7eb;
text-align:left;
font-size:14px;
}

/* SCORE */

.score-box{
display:flex;
gap:12px;
margin-top:15px;
flex-wrap:wrap;
}

.score{
background:#eef2ff;
color:#4f46e5;
padding:8px 14px;
border-radius:8px;
font-weight:600;
}

/* EMPTY STATE */

.empty{
text-align:center;
margin-top:80px;
}

.empty h3{
margin-bottom:10px;
}

.empty button{
padding:10px 20px;
margin:10px;
border:none;
background:#4f46e5;
color:white;
border-radius:8px;
cursor:pointer;
font-weight:600;
transition:.25s;
}

.empty button:hover{
background:#4338ca;
}

.secondary-btn{
background:#10b981 !important;
}

.secondary-btn:hover{
background:#059669 !important;
}

</style>

</head>

<body>

<div class="sidebar">

<h2>InterviewAI</h2>

<a href="index.html">
<i data-lucide="layout-dashboard"></i>
Dashboard
</a>

<a href="profile.html">
<i data-lucide="user"></i>
Profile
</a>

<a href="history.html">
<i data-lucide="history"></i>
History
</a>

<a href="interview.html">
<i data-lucide="mic"></i>
New Interview
</a>

<a href="index.html">
<i data-lucide="home"></i>
Home
</a>

</div>

<div class="main">

<div class="title">Your Interview History</div>

<div id="historyContainer"></div>

</div>

<script>
lucide.createIcons();
</script>

<script src="js/history.js"></script>

</body>
</html>
