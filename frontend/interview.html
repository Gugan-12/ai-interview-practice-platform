<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Interview | InterviewAI</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>

/* ================= GLOBAL ================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Inter",sans-serif;
}

body{
display:flex;
background:linear-gradient(-45deg,#eef2ff,#f8fafc,#e0f2fe,#eef2ff);
background-size:400% 400%;
animation:bgMove 12s ease infinite;
}

@keyframes bgMove{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}

/* ================= SIDEBAR ================= */

.sidebar{
width:240px;
height:100vh;
background:#0b132b;
color:white;
padding:20px;
position:fixed;
left:-200px;
transition:0.3s;
box-shadow:4px 0 15px rgba(0,0,0,0.2);
}

.sidebar:hover{
left:0;
}

.sidebar h2{
text-align:center;
margin-bottom:30px;
}

.sidebar ul{
list-style:none;
}

.sidebar ul li{
margin:18px 0;
}

.sidebar ul li a{
text-decoration:none;
color:#cbd5e1;
padding:10px;
display:block;
border-radius:8px;
transition:.25s;
}

.sidebar ul li a:hover{
background:#4f46e5;
color:white;
transform:translateX(5px);
}

/* ================= MAIN ================= */

.main{
margin-left:60px;
padding:40px;
width:100%;
}

/* ================= SETUP CARD ================= */

.setup-card{
background:rgba(255,255,255,0.9);
backdrop-filter:blur(10px);
padding:35px;
border-radius:16px;
box-shadow:0 15px 40px rgba(0,0,0,0.08);
max-width:600px;
margin:auto;
animation:fadeUp .6s ease;
}

@keyframes fadeUp{
from{opacity:0;transform:translateY(15px)}
to{opacity:1}
}

.setup-card h2{
margin-bottom:25px;
}

.form-group{
margin-bottom:20px;
}

label{
font-weight:600;
margin-bottom:6px;
display:block;
}

select{
width:100%;
padding:10px;
border-radius:8px;
border:1px solid #e2e8f0;
transition:.25s;
}

select:focus{
border-color:#4f46e5;
outline:none;
}

/* BUTTON */

.start-btn{
margin-top:20px;
width:100%;
padding:12px;
background:linear-gradient(135deg,#4f46e5,#06b6d4);
color:white;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:600;
transition:.3s;
}

.start-btn:hover{
transform:translateY(-2px);
box-shadow:0 8px 20px rgba(79,70,229,.3);
}

/* ================= CHAT CONTAINER ================= */

.chat-wrapper{
width:100%;
max-width:850px;
margin:auto;
height:85vh;
background:white;
border-radius:16px;
display:none;
flex-direction:column;
box-shadow:0 15px 40px rgba(0,0,0,0.08);
overflow:hidden;
animation:fadeUp .5s ease;
}

/* HEADER */

.chat-header{
padding:18px 25px;
background:linear-gradient(135deg,#4f46e5,#06b6d4);
color:white;
display:flex;
justify-content:space-between;
align-items:center;
}

.header-right{
display:flex;
align-items:center;
gap:15px;
}

.timer{
font-weight:bold;
}

/* END BUTTON */

.end-btn{
background:#ef4444;
border:none;
padding:8px 14px;
border-radius:8px;
color:white;
cursor:pointer;
transition:.25s;
}

.end-btn:hover{
transform:scale(1.05);
}

/* BODY */

.chat-body{
flex:1;
padding:25px;
background:#f1f5f9;
overflow-y:auto;
display:flex;
flex-direction:column;
gap:12px;
}

/* MESSAGES */

.message{
max-width:70%;
padding:12px 16px;
border-radius:18px;
font-size:14px;
line-height:1.5;
animation:msgFade .25s ease;
}

@keyframes msgFade{
from{opacity:0;transform:translateY(5px)}
to{opacity:1}
}

.ai-message{
background:#e0e7ff;
align-self:flex-start;
border-bottom-left-radius:5px;
}

.user-message{
background:#4f46e5;
color:white;
align-self:flex-end;
border-bottom-right-radius:5px;
}

/* FOOTER */

.chat-footer{
padding:15px;
display:flex;
gap:10px;
border-top:1px solid #e5e7eb;
background:white;
}

.chat-footer textarea{
flex:1;
resize:none;
padding:10px;
border-radius:10px;
border:1px solid #d1d5db;
height:45px;
transition:.25s;
}

.chat-footer textarea:focus{
outline:none;
border-color:#4f46e5;
}

/* VOICE BUTTON */

.voice-btn{
background:#10b981;
border:none;
color:white;
padding:10px 14px;
border-radius:10px;
cursor:pointer;
transition:.25s;
}

.voice-btn:hover{
transform:scale(1.1);
}

/* SEND BUTTON */

.send-btn{
background:#4f46e5;
border:none;
color:white;
padding:10px 16px;
border-radius:10px;
cursor:pointer;
transition:.25s;
}

.send-btn:hover{
background:#4338ca;
transform:scale(1.05);
}

/* LOADER */

.loader{
text-align:center;
padding:10px;
font-size:14px;
color:#4f46e5;
font-weight:bold;
animation:blink 1.2s infinite;
}

@keyframes blink{
0%,100%{opacity:1}
50%{opacity:.4}
}

</style>
</head>

<body>

<div class="sidebar">
  <h2>InterviewAI</h2>
  <ul>

    <li>
      <a href="index.html">
        <i data-lucide="layout-dashboard"></i>
        Dashboard
      </a>
    </li>

    <li>
      <a href="profile.html">
        <i data-lucide="user"></i>
        Profile
      </a>
    </li>

    <li>
      <a href="history.html">
        <i data-lucide="history"></i>
        History
      </a>
    </li>

    <li>
      <a href="#" onclick="logout()">
        <i data-lucide="log-out"></i>
        Logout
      </a>
    </li>

  </ul>
</div>
<div class="main">

  <!-- SETUP -->
  <div class="setup-card" id="setupScreen">
    <h2>Start Mock Interview</h2>

    <div class="form-group">
      <label>Role</label>
      <select id="roleSelect">
        <option>Java Developer</option>
        <option>Frontend Developer</option>
        <option>Data Analyst</option>
      </select>
    </div>

    <div class="form-group">
      <label>Interview Type</label>
      <select id="typeSelect">
        <option>Technical</option>
        <option>HR</option>
        <option>Both</option>
      </select>
    </div>

    <div class="form-group">
      <label>Duration</label>
      <select id="durationSelect">
        <option value="10">10 Minutes</option>
        <option value="15">15 Minutes</option>
        <option value="30">30 Minutes</option>
      </select>
    </div>

    <button class="start-btn" onclick="startInterview()">Start Interview</button>
  </div>

  <!-- CHAT -->
  <div class="chat-wrapper" id="chatWrapper">

    <div class="chat-header">
      <div>
        <h3 id="chatTitle">AI Interview</h3>
      </div>

      <div class="header-right">
        <div class="timer" id="timer">00:00</div>
        <button class="end-btn" id="endBtn">End</button>
      </div>
    </div>

    <div class="chat-body" id="conversationArea"></div>

    <div class="chat-footer">
      <textarea id="answerBox" placeholder="Type your answer..."></textarea>
      <button onclick="startVoice()" class="voice-btn">🎤</button>
      <button onclick="submitAnswer()" class="send-btn">Send</button>
    </div>

    <div id="loader" class="loader" style="display:none;">Thinking...</div>

  </div>

</div>

<script src="js/interview.js"></script>
<script src="js/authCheck.js"></script>
<script src="js/logout.js"></script>

<script>
lucide.createIcons();
</script>
</body>
</html>
